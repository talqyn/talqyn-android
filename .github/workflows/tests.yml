name: Tests

# GitHub Flow: main changes only through a pull request, and a pull request
# can merge only when up to date with main — so the run on the pull request
# has already tested what lands, and a second run after the merge would test
# the same tree again.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes the run before it pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The image carries the Android SDK with platform 36, so nothing is
    # downloaded before the build.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle between runs and checks the wrapper jar against Gradle's
      # published checksums: a pull request cannot slip in a tampered wrapper.
      - uses: gradle/actions/setup-gradle@v6

      # Warnings already fail the build (allWarningsAsErrors). The sample's
      # release build is where the promise of no R8 rules is held: it shrinks
      # the SDK the way an app's release does.
      - name: Unit tests and the sample's release build
        run: ./gradlew test :sample:assembleRelease
